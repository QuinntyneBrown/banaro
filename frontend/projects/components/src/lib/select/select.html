<ng-template #wrap>
  <span class="select__wrap">
    <ng-content select="select[bn-input]" />
    <svg class="icon icon--sm select__chev" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m7 10 5 5 5-5" />
    </svg>
  </span>
</ng-template>
@if (label(); as text) {
  <!-- The label wraps the projected native select through the template above, so it names it. -->
  <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
  <label class="select">
    <span>{{ text }}</span>
    <ng-container [ngTemplateOutlet]="wrap" />
  </label>
} @else {
  <ng-container [ngTemplateOutlet]="wrap" />
}
