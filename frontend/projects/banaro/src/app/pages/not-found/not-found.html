<div class="wrap">
  <bn-error-page
    code="404"
    [heading]="'errors.notFound.heading' | t"
    [lead]="'errors.notFound.lead' | t"
  >
    <bn-search-box
      inputId="nf-q"
      [label]="'errors.notFound.searchLabel' | t"
      [placeholder]="'errors.notFound.searchPlaceholder' | t"
      [buttonLabel]="'errors.notFound.search' | t"
      (searched)="search($event)"
    />
    <div class="cluster">
      <a bn-button variant="quiet" routerLink="/builders">{{ 'errors.notFound.browse' | t }}</a>
      <a bn-button variant="quiet" routerLink="/">{{ 'errors.home' | t }}</a>
    </div>
  </bn-error-page>
</div>
