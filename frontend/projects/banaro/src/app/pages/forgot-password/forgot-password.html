<div class="wrap">
  @if (state() === 'success') {
    <bn-auth-card
      icon="mail"
      [heading]="'identity.forgot.success.title' | t"
      [sub]="'identity.forgot.success.sub' | t: { email: sentTo() }"
    >
      @if (alert()) {
        <bn-alert variant="danger" [heading]="alert()!" />
      }
      <div class="form-actions">
        <a bn-button variant="primary" routerLink="/sign-in">{{ 'identity.forgot.back' | t }}</a>
        <button bn-button variant="quiet" type="button" (click)="sendAgain()">
          {{ 'identity.forgot.success.again' | t }}
        </button>
      </div>
    </bn-auth-card>
  } @else {
    <bn-auth-card [heading]="'identity.forgot.title' | t" [sub]="'identity.forgot.sub' | t">
      <form
        class="form"
        novalidate
        [attr.aria-label]="'identity.forgot.formLabel' | t"
        [formGroup]="form"
        (ngSubmit)="submit()"
      >
        @if (state() === 'invalid') {
          <bn-form-summary [heading]="'identity.errors.summary' | t" [errors]="summaryErrors()" />
        }
        @if (alert()) {
          <bn-alert variant="danger" [heading]="alert()!" />
        }
        <bn-field [label]="'identity.forgot.email' | t" controlId="email" [error]="emailError()">
          <input
            bn-input
            id="email"
            type="email"
            autocomplete="email"
            formControlName="email"
            [readonly]="state() === 'submitting'"
            [invalid]="!!emailError()"
            [attr.aria-describedby]="describedBy('email', emailError())"
          />
        </bn-field>
        <div class="form-actions">
          <button
            bn-button
            variant="primary"
            type="submit"
            [busy]="state() === 'submitting'"
            [disabled]="state() === 'submitting' || offline()"
          >
            {{
              (state() === 'submitting' ? 'identity.forgot.submitting' : 'identity.forgot.submit')
                | t
            }}
          </button>
          <a bn-button variant="quiet" routerLink="/sign-in">{{ 'identity.forgot.back' | t }}</a>
        </div>
      </form>
    </bn-auth-card>
  }
</div>
