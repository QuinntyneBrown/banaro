<div class="wrap">
  @switch (state()) {
    @case ('success') {
      <bn-auth-card
        icon="check"
        [heading]="'identity.reset.success.title' | t"
        [sub]="'identity.reset.success.sub' | t"
      >
        <div class="form-actions">
          <a bn-button variant="primary" routerLink="/sign-in">{{
            'identity.reset.success.signIn' | t
          }}</a>
        </div>
      </bn-auth-card>
    }
    @case ('error') {
      <bn-auth-card
        icon="alert"
        [heading]="'identity.reset.error.title' | t"
        [sub]="'identity.reset.error.sub' | t"
      >
        <div class="form-actions">
          <a bn-button variant="primary" routerLink="/forgot-password">{{
            'identity.reset.error.newLink' | t
          }}</a>
          <a bn-button variant="quiet" routerLink="/sign-in">{{
            'identity.reset.error.signIn' | t
          }}</a>
        </div>
      </bn-auth-card>
    }
    @default {
      <bn-auth-card
        [heading]="'identity.reset.title' | t"
        [sub]="'identity.reset.sub' | t: { email: email() }"
      >
        <form
          class="form"
          novalidate
          [attr.aria-label]="'identity.reset.formLabel' | t"
          [formGroup]="form"
          (ngSubmit)="submit()"
        >
          @if (state() === 'invalid') {
            <bn-form-summary [heading]="'identity.errors.summary' | t" [errors]="summaryErrors()" />
          }
          @if (alert()) {
            <bn-alert variant="danger" [heading]="alert()!" />
          }
          <bn-field
            [label]="'identity.reset.password' | t"
            controlId="password"
            [help]="'identity.reset.passwordHelp' | t"
            [error]="errors().password"
          >
            <input
              bn-input
              id="password"
              type="password"
              autocomplete="new-password"
              formControlName="password"
              [readonly]="state() === 'submitting'"
              [invalid]="!!errors().password"
              [attr.aria-describedby]="describedBy('password', errors().password, true)"
            />
          </bn-field>
          <bn-field
            [label]="'identity.reset.confirm' | t"
            controlId="confirm"
            [error]="errors().confirm"
          >
            <input
              bn-input
              id="confirm"
              type="password"
              autocomplete="new-password"
              formControlName="confirm"
              [readonly]="state() === 'submitting'"
              [invalid]="!!errors().confirm"
              [attr.aria-describedby]="describedBy('confirm', errors().confirm)"
            />
          </bn-field>
          <div class="form-actions">
            <button
              bn-button
              variant="primary"
              type="submit"
              [busy]="state() === 'submitting'"
              [disabled]="state() === 'submitting' || offline()"
            >
              {{
                (state() === 'submitting' ? 'identity.reset.submitting' : 'identity.reset.submit')
                  | t
              }}
            </button>
          </div>
        </form>
      </bn-auth-card>
    }
  }
</div>
