# Local backend for Banaro (ADR-0002, ADR-0007). Install dependencies once, and run migrations
# explicitly; they never run on start:
#   docker compose run --rm api npm ci
#   docker compose run --rm api npm run banaro -- migrate --seed
x-banaro-api: &banaro-api
  build:
    context: ./backend
    target: dev
  image: banaro-api:dev
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DATABASE_URL: postgres://banaro:banaro@postgres:5432/banaro
    REDIS_URL: redis://redis:6379
    WATCHPACK_POLLING: 'true'
  volumes:
    - ./backend:/app
    - banaro-api-node-modules:/app/node_modules
    - ./frontend:/frontend:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *banaro-api
    ports:
      - '8100:8000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8000/health/live').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 10s
      retries: 60

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: banaro
      POSTGRES_PASSWORD: banaro
      POSTGRES_DB: banaro
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banaro']
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  postgres-data:
  banaro-api-node-modules:
